<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Send a job to Jean Limo</title>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#0B0B0C; color:#F6F1E8; }
    .wrap { max-width:520px; margin:0 auto; padding:28px 16px 48px; }
    h1 { font-size:30px; margin:8px 0; }
    .gold { color:#C4A574; letter-spacing:.16em; font-size:12px; }
    p { color:#9A9388; line-height:1.5; }
    input, select, textarea, .addr { width:100%; margin-top:10px; background:#1C1C20; color:#F6F1E8; border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px; font-size:16px; box-sizing:border-box; }
    .addr { text-align:left; }
    .addr.empty { color:#9A9388; }
    button.send { width:100%; margin-top:14px; border:0; border-radius:14px; padding:14px; font-weight:700; background:linear-gradient(180deg,#E8D3B0,#C4A574); color:#16110a; }
    .err { color:#f87171; }
    .sheet { display:none; position:fixed; inset:0; background:#0B0B0C; z-index:20; padding:16px; }
    .sheet.on { display:block; }
    .row { display:flex; gap:8px; align-items:center; }
    .back { width:44px; height:44px; border:0; background:transparent; color:#F6F1E8; font-size:28px; }
    .hint { display:block; width:100%; text-align:left; background:transparent; color:#F6F1E8; border:0; border-bottom:1px solid rgba(255,255,255,.08); padding:14px 4px; font-size:16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="gold">FARM IN · HOUSTON</div>
    <h1>Send a job to Jean Limo</h1>
    <p>Approved partners only. You pay Jean Limo the amount you enter. Do not send your customer to pay us. We accept or decline before the trip is confirmed.</p>
    <form id="f">
      <input name="email" type="email" placeholder="Your approved partner email" required />
      <input name="passenger" placeholder="Passenger name" required />
      <input name="phone" placeholder="Passenger phone" />
      <input name="date" type="date" required />
      <input name="time" type="time" required />
      <button type="button" class="addr empty" id="pickup-btn">Pickup in Houston</button>
      <input type="hidden" name="pickup" id="pickup" required />
      <button type="button" class="addr empty" id="dropoff-btn">Drop-off</button>
      <input type="hidden" name="dropoff" id="dropoff" required />
      <input name="flight" placeholder="Flight number" />
      <input name="passengers" placeholder="Passengers" />
      <select name="vehicle"><option value="sedan">Sedan</option><option value="suv">SUV</option><option value="sprinter">Sprinter</option></select>
      <input name="pay" type="number" min="1" step="1" placeholder="Price you pay Jean Limo $" required />
      <textarea name="notes" rows="3" placeholder="Notes"></textarea>
      <button class="send" type="submit">Send offer</button>
      <p class="err" id="err"></p>
    </form>
  </div>
  <div class="sheet" id="sheet">
    <div class="row">
      <button type="button" class="back" id="close">‹</button>
      <input id="q" placeholder="Airport, hotel, or address" autocomplete="off" />
    </div>
    <div id="hints"></div>
  </div>
  <script>
    let target = null;
    let timer = null;
    let ready = false;
    const sheet = document.getElementById('sheet');
    const q = document.getElementById('q');
    function loadMaps() {
      if (window.google && window.google.maps && window.google.maps.places) { ready = true; return Promise.resolve(); }
      return fetch('/api/maps-key').then(r => r.json()).then(data => {
        if (!data.key) throw new Error('Maps key missing');
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(data.key) + '&libraries=places&loading=async';
          script.onload = () => { ready = true; resolve(); };
          script.onerror = () => reject(new Error('Google Maps failed to load'));
          document.head.appendChild(script);
        });
      });
    }
    function openSearch(name) {
      target = name;
      q.value = document.getElementById(name).value || '';
      document.getElementById('hints').innerHTML = '';
      sheet.classList.add('on');
      setTimeout(() => q.focus(), 50);
      loadMaps().then(search).catch(err => { document.getElementById('hints').textContent = err.message; });
    }
    document.getElementById('pickup-btn').onclick = () => openSearch('pickup');
    document.getElementById('dropoff-btn').onclick = () => openSearch('dropoff');
    document.getElementById('close').onclick = () => sheet.classList.remove('on');
    function choose(text) {
      document.getElementById(target).value = text;
      const btn = document.getElementById(target + '-btn');
      btn.textContent = text;
      btn.classList.remove('empty');
      sheet.classList.remove('on');
    }
    function search() {
      const text = q.value.trim();
      const box = document.getElementById('hints');
      if (text.length < 2 || !ready || !window.google) { box.innerHTML = ''; return; }
      const input = /houston/i.test(text) ? text : text + ' Houston';
      new window.google.maps.places.AutocompleteService().getPlacePredictions({
        input,
        componentRestrictions: { country: 'us' },
        location: new window.google.maps.LatLng(29.7604, -95.3698),
        radius: 80000
      }, (preds, status) => {
        const list = preds || [];
        if (!list.length) { box.textContent = status && status !== 'ZERO_RESULTS' ? status : 'Keep typing an airport, hotel, or address.'; return; }
        box.innerHTML = list.slice(0, 8).map(p => '<button type="button" class="hint">' + p.description.replace(/</g,'') + '</button>').join('');
        box.querySelectorAll('button').forEach(b => b.onclick = () => choose(b.textContent));
      });
    }
    q.oninput = () => { clearTimeout(timer); timer = setTimeout(search, 200); };
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      if (!document.getElementById('pickup').value || !document.getElementById('dropoff').value) {
        document.getElementById('err').textContent = 'Choose a pickup and drop-off from the list.';
        return;
      }
      const body = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch('/api/farmin', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) { document.getElementById('err').textContent = data.error || 'Could not send'; return; }
      e.target.outerHTML = '<p>Offer sent. Jean Limo will accept or decline. The passenger is not confirmed until you hear back.</p>';
    };
  </script>
</body>
</html>
