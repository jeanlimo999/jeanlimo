<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0C" />
  <title>Jean Limo Driver</title>
  <style>
    :root { --bg:#0B0B0C; --bg2:#141416; --line:rgba(255,255,255,.08); --gold:#C4A574; --gold2:#E8D3B0; --text:#F6F1E8; --muted:#9A9388; --ok:#7DCFB6; --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); min-height:100dvh; }
    .screen { display:none; } .screen.on { display:block; }
    .top { padding:calc(12px + var(--safe-t)) 16px 10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); }
    .brand { letter-spacing:.16em; font-size:13px; color:var(--gold2); }
    .pad { padding:18px 18px calc(18px + var(--safe-b)); }
    h1 { font-size:28px; margin-top:8px; }
    .sub { color:var(--muted); margin-top:6px; font-size:14px; }
    input { width:100%; background:#1C1C20; border:1px solid var(--line); color:var(--text); border-radius:14px; padding:14px; font-size:16px; margin-top:10px; }
    .primary { width:100%; border:0; border-radius:16px; padding:16px; font-size:17px; font-weight:600; background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#16110a; margin-top:14px; }
    .ghost { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:7px 12px; }
    .job { background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; }
    .when { color:var(--gold2); font-size:22px; font-weight:700; margin-top:2px; line-height:1.2; }
    .meta { color:var(--muted); font-size:14px; margin-top:4px; line-height:1.4; }
    .note { color:var(--gold2); white-space:pre-wrap; }
    a { color:#C4A574; }
    .tabs { display:flex; gap:8px; margin-bottom:12px; }
    .tab { flex:1; border:1px solid var(--line); background:var(--bg2); color:var(--muted); border-radius:999px; padding:10px; font-weight:700; }
    .tab.on { background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#16110a; border:0; }
    .slide { position:relative; margin-top:14px; height:58px; border-radius:999px; background:#2a2a2e; overflow:hidden; touch-action:none; user-select:none; }
    .slide.locked { background:#1a1a1d; }
    .slide .label { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:#d8d2c8; pointer-events:none; text-align:center; padding:0 64px; }
    .slide.locked .label { color:#8d877e; font-weight:600; }
    .slide .thumb { position:absolute; left:4px; top:4px; width:50px; height:50px; border-radius:999px; background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#16110a; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; }
    .slide.locked .thumb { background:#3a3a3e; color:#777; }
  </style>
</head>
<body>
  <section class="screen on" id="login">
    <div class="top"><div class="brand">JEAN LIMO</div><div class="brand">DRIVER</div></div>
    <div class="pad"><h1>Login</h1><p class="sub">Type your name and the dispatch PIN.</p>
      <input id="username" placeholder="Username" autocomplete="username" />
      <input id="pin" type="password" inputmode="numeric" placeholder="PIN" />
      <button class="primary" id="signin" type="button">Login</button>
      <p class="sub" id="login-err"></p>
    </div>
  </section>
  <section class="screen" id="jobs">
    <div class="top"><div class="brand">JEAN LIMO</div><button class="ghost" id="signout" type="button">Sign out</button></div>
    <div class="pad">
      <h1 id="hello">Your jobs</h1>
      <div class="tabs"><button class="tab on" id="tab-open" type="button">Upcoming</button><button class="tab" id="tab-available" type="button">Available</button><button class="tab" id="tab-done" type="button">Completed</button></div>
      <div id="joblist"></div>
    </div>
  </section>
  <script>
    const $ = id => document.getElementById(id);
    const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
    let jobs = [], doneJobs = [], available = [], tab = 'open', driver = null;
    function esc(s){ return String(s||'').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>'); }
    function fmtDate(value){
      const m = String(value||'').match(/(\d{4})-(\d{2})-(\d{2})/);
      return m ? m[2]+'/'+m[3]+'/'+m[1] : '';
    }
    function fmtTime(value){
      const m = String(value||'').match(/(\d{1,2}):(\d{2})/);
      if(!m) return '';
      let hour = parseInt(m[1],10);
      const ampm = hour >= 12 ? 'PM' : 'AM';
      hour = hour % 12 === 0 ? 12 : hour % 12;
      return hour+':'+m[2]+' '+ampm;
    }
    function whenLabel(j){
      const date = fmtDate(j.rideDate || j.when);
      const time = fmtTime(j.rideTime || j.when);
      return [date, time].filter(Boolean).join(' \u00b7 ');
    }
    function maps(addr){ if(!addr) return ''; const q = encodeURIComponent(addr); return '<div class="meta">'+esc(addr)+'</div><div class="meta"><a href="https://maps.apple.com/?daddr='+q+'">Apple Maps</a> \u00b7 <a href="https://www.google.com/maps/dir/?api=1&destination='+q+'">Google Maps</a></div>'; }
    function pickupDate(j){
      const date = String(j.rideDate || '').slice(0,10);
      const time = String(j.rideTime || '00:00').slice(0,5);
      if(!date) return null;
      const d = new Date(date+'T'+time+':00');
      return Number.isNaN(d.getTime()) ? null : d;
    }
    function clock(d){
      let h = d.getHours();
      const m = String(d.getMinutes()).padStart(2,'0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 === 0 ? 12 : h % 12;
      return h+':'+m+' '+ampm;
    }
    function nextStep(status){
      if (status === 'on_the_way') return { value:'on_location', label:'Slide for At location' };
      if (status === 'on_location') return { value:'onboard', label:'Slide for Customer on board' };
      if (status === 'onboard') return { value:'dropped_off', label:'Slide for Dropped off' };
      return { value:'on_the_way', label:'Slide for On the way' };
    }
    function slider(j){
      if (tab === 'done' || j.available) return '';
      const status = j.tripStatus || '';
      const started = ['on_the_way','on_location','onboard'].includes(status);
      const pickup = pickupDate(j);
      const openAt = pickup ? pickup.getTime() - 3*60*60*1000 : 0;
      const ready = started || (pickup && Date.now() >= openAt);
      const step = nextStep(status);
      const label = ready ? step.label : ('Earliest start: ' + (pickup ? clock(new Date(openAt)) : ''));
      return '<div class="slide'+(ready?'':' locked')+'" data-id="'+esc(j.bookingId)+'" data-leg="'+esc(j.live_leg||'outbound')+'" data-next="'+step.value+'"><div class="label">'+esc(label)+'</div><div class="thumb">&#8594;</div></div>';
    }
    function card(j){
      const digits = String(j.guestPhone||'').replace(/[^0-9+]/g,'');
      const phone = digits ? ' <a href="tel:'+digits+'">'+esc(j.guestPhone)+'</a> <a href="tel:'+digits+'">Call</a> <a href="sms:'+digits+'">Text</a>' : '';
      const notes = String(j.notes||'').trim();
      const pay = Number(j.driverPay || 0);
      const fare = pay ? '<div class="when" style="font-size:18px">Your pay $'+pay.toFixed(0)+'</div>' : '';
      const accept = j.available ? '<button class="primary accept" type="button" data-accept="'+esc(j.bookingId)+'">Accept job</button>' : slider(j);
      return '<div class="job"><div class="when">'+esc(whenLabel(j))+'</div>'+fare+'<div>'+esc(j.guestName||'Guest')+phone+'</div><div class="meta">Pickup</div>'+maps(j.pickup)+'<div class="meta">Drop-off</div>'+maps(j.dropoff)+(j.flight?'<div class="meta">Flight: '+esc(j.flight)+'</div>':'')+(j.passengers?'<div class="meta">Passengers: '+esc(j.passengers)+'</div>':'')+(notes?'<div class="meta">Additional note</div><div class="meta note">'+esc(notes)+'</div>':'')+accept+'</div>';
    }
    function render(){
      $('tab-open').classList.toggle('on', tab==='open');
      $('tab-available').classList.toggle('on', tab==='available');
      $('tab-done').classList.toggle('on', tab==='done');
      const list = tab==='done' ? doneJobs : tab==='available' ? available : jobs;
      $('joblist').innerHTML = list.length ? list.map(card).join('') : '<p class="sub">No trips in this tab.</p>';
      wireSlides();
    }
    function wireSlides(){
      document.querySelectorAll('.slide').forEach(slide => {
        if (slide.classList.contains('locked')) return;
        const thumb = slide.querySelector('.thumb');
        let dragging = false, startX = 0;
        const max = () => slide.clientWidth - thumb.clientWidth - 8;
        const down = (e) => { dragging = true; startX = e.clientX; thumb.setPointerCapture(e.pointerId); };
        const move = (e) => {
          if (!dragging) return;
          const left = Math.max(4, Math.min(max(), 4 + (e.clientX - startX)));
          thumb.style.left = left + 'px';
        };
        const up = async () => {
          if (!dragging) return;
          dragging = false;
          const left = parseFloat(thumb.style.left || '4');
          if (left < max() * 0.82) { thumb.style.left = '4px'; return; }
          try {
            await api('/api/driver/status', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ bookingId: slide.dataset.id, status: slide.dataset.next, live_leg: slide.dataset.leg }) });
            if (slide.dataset.next === 'dropped_off') tab = 'done';
            await load();
          } catch (err) { alert(err.message || 'Could not update'); thumb.style.left = '4px'; }
        };
        thumb.addEventListener('pointerdown', down);
        thumb.addEventListener('pointermove', move);
        thumb.addEventListener('pointerup', up);
        thumb.addEventListener('pointercancel', up);
      });
    }
    async function api(url, opts){
      const res = await fetch(url, Object.assign({credentials:'same-origin'}, opts||{}));
      const data = await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }
    async function load(){
      const data = await api('/api/driver/jobs');
      driver = data.driver;
      const all = data.jobs || [];
      jobs = all.filter(j => j.tripStatus !== 'dropped_off');
      doneJobs = all.filter(j => j.tripStatus === 'dropped_off');
      available = data.available || [];
      $('hello').textContent = ((driver && driver.name) || 'Driver');
      render();
    }
    $('joblist').onclick = async (e) => {
      const btn = e.target.closest('[data-accept]');
      if (!btn) return;
      try {
        await api('/api/driver/accept', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ bookingId: btn.dataset.accept }) });
        tab = 'open';
        await load();
      } catch (err) { alert(err.message || 'Could not accept'); }
    };
    $('tab-open').onclick = () => { tab='open'; render(); };
    $('tab-available').onclick = () => { tab='available'; render(); };
    $('tab-done').onclick = () => { tab='done'; render(); };
    $('signin').onclick = async () => {
      try {
        await api('/api/driver/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: $('username').value.trim(), pin: $('pin').value.trim() }) });
        await load(); show('jobs');
      } catch(e) { $('login-err').textContent = e.message || 'Wrong PIN'; }
    };
    $('signout').onclick = async () => { await fetch('/api/driver/logout', {method:'POST', credentials:'same-origin'}); show('login'); };
    (async () => { try { await load(); show('jobs'); } catch {} })();
  </script>
</body>
</html>
