<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Jean Limo Driver</title>
  <style>
    :root { --bg:#0B0B0C; --bg2:#141416; --line:rgba(255,255,255,.08); --gold:#C4A574; --gold2:#E8D3B0; --text:#F6F1E8; --muted:#9A9388; --ok:#7DCFB6; --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom); }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); height:100dvh; display:flex; flex-direction:column; }
    .screen { display:none; flex:1; flex-direction:column; min-height:0; }
    .screen.on { display:flex; }
    .top { padding:calc(16px + var(--safe-t)) 18px 8px; display:flex; justify-content:space-between; align-items:center; }
    .brand { letter-spacing:.16em; font-size:13px; color:var(--gold2); font-weight:600; }
    .ghost { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:7px 12px; font-size:12px; }
    .hero { padding:8px 18px 16px; }
    .eyebrow { color:var(--gold); font-size:11px; letter-spacing:.2em; text-transform:uppercase; }
    h1 { font-size:28px; font-weight:560; letter-spacing:-.03em; margin-top:6px; }
    .sub { color:var(--muted); margin-top:6px; font-size:14px; line-height:1.45; }
    .pad { padding:0 18px calc(18px + var(--safe-b)); }
    input { width:100%; background:#1C1C20; border:1px solid var(--line); color:var(--text); border-radius:14px; padding:14px; font-size:16px; margin-top:10px; }
    .primary, .status { width:100%; border:0; border-radius:16px; padding:16px; font-size:17px; font-weight:600; }
    .primary { background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#16110a; margin-top:14px; }
    .status { text-align:left; background:var(--bg2); border:1px solid var(--line); color:var(--text); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; min-height:84px; }
    .status.next { border-color:rgba(196,165,116,.55); }
    .status.next .title { color:var(--gold2); }
    .status.done .title { color:var(--ok); }
    .kicker { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .title { font-size:20px; margin-top:3px; }
    .dot { width:12px; height:12px; border-radius:50%; background:#3a3a40; }
    .status.next .dot { background:var(--gold); }
    .status.done .dot { background:var(--ok); }
    .job { background:var(--bg2); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; }
    .job.done { opacity:.85; }
    .job .meta { color:var(--muted); font-size:14px; margin-top:4px; line-height:1.4; }
    .tabs { display:flex; gap:8px; padding:0 18px 12px; }
    .tab { flex:1; border:1px solid var(--line); background:var(--bg2); color:var(--muted); border-radius:999px; padding:10px 12px; font-size:13px; font-weight:700; }
    .tab.on { background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#16110a; border-color:transparent; }
    .gps { font-size:12px; color:var(--muted); padding:0 18px 10px; }
    .gps.on { color:var(--ok); }
    .sheet { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); align-items:flex-end; z-index:50; }
    .sheet.show { display:flex; }
    .panel { width:100%; background:#161618; border-radius:24px 24px 0 0; padding:16px 18px calc(18px + var(--safe-b)); }
    .preview { background:#1C1C20; border-radius:14px; padding:12px; margin:12px 0; font-size:14px; line-height:1.5; color:#ddd6cc; white-space:pre-wrap; }
    .act { width:100%; border:1px solid var(--line); background:var(--bg2); color:var(--text); border-radius:14px; padding:14px; font-weight:600; margin-top:8px; }
    .act.gold { background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#16110a; border:0; }
    .toast { position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); transform:translateX(-50%); background:#222; border:1px solid var(--line); padding:10px 14px; border-radius:999px; font-size:13px; opacity:0; z-index:60; }
    .toast.show { opacity:1; }
    .scroll { flex:1; overflow:auto; }
  </style>
</head>
<body>
  <section class="screen on" id="login">
    <div class="top"><div class="brand">JEAN LIMO DRIVER</div></div>
    <div class="hero">
      <div class="eyebrow">Sign in</div>
      <h1>Start shift</h1>
      <p class="sub">Type your name and the dispatch PIN. Stays signed in for 12 hours.</p>
    </div>
    <div class="pad">
      <input id="username" type="text" autocomplete="username" autocapitalize="words" placeholder="Username" />
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" />
      <button class="primary" id="signin">Start shift</button>
    </div>
  </section>
  <section class="screen" id="jobs">
    <div class="top">
      <div class="brand" id="hello">DRIVER</div>
      <button class="ghost" id="signout">Sign out</button>
    </div>
    <div class="hero">
      <div class="eyebrow">Your jobs</div>
      <h1>Assigned to you</h1>
    </div>
    <div class="gps" id="gps">GPS off</div>
    <div class="tabs">
      <button class="tab on" id="tab-open" type="button">Upcoming trips</button>
      <button class="tab" id="tab-done" type="button">Completed</button>
    </div>
    <div class="scroll pad" id="joblist"></div>
  </section>
  <section class="screen" id="trip">
    <div class="top"><button class="ghost" id="back">Jobs</button><div class="brand">LIVE</div><span></span></div>
    <div class="hero">
      <div class="eyebrow" id="trip-when"></div>
      <h1 id="trip-guest">Guest</h1>
      <p class="sub" id="trip-route"></p>
    </div>
    <div class="gps" id="gps2">GPS off</div>
    <div class="scroll pad">
      <button class="status next" data-status="on_the_way"><div><div class="kicker">Step 1 · texts the guest</div><div class="title">On the way</div></div><div class="dot"></div></button>
      <button class="status" data-status="on_location"><div><div class="kicker">Step 2 · texts the guest</div><div class="title">On location</div></div><div class="dot"></div></button>
      <button class="status" data-status="dropped_off"><div><div class="kicker">Step 3 · texts dispatch</div><div class="title">Dropped off</div></div><div class="dot"></div></button>
    </div>
  </section>
  <div class="sheet" id="sheet">
    <div class="panel">
      <div class="eyebrow" id="sheet-kicker">Notify</div>
      <h1 style="font-size:22px;margin-top:6px" id="sheet-title">Send text</h1>
      <div class="preview" id="sheet-preview"></div>
      <button class="act gold" id="send-sms">Open Messages and send</button>
      <button class="act" id="send-wa">WhatsApp</button>
      <button class="act" id="skip">Mark status only</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const $ = id => document.getElementById(id);
    const toast = m => { const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); };
    const show = id => { document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $(id).classList.add("on"); };
    let driver = null, jobs = [], doneJobs = [], current = null, pending = null, watchId = null, tab = "open";
    function esc(s) {
      return String(s || "").replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">").replace(/"/g,""");
    }
    function shortAddr(a) { return String(a || "").split(",")[0]; }
    function firstName(n) { return String(n || "there").trim().split(/\s+/)[0]; }
    function fmtDate(value) {
      const m = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? m[2] + "/" + m[3] + "/" + m[1] : (value || "");
    }
    function fmtTime(value) {
      const m = String(value || "").match(/^(\d{1,2}):(\d{2})/);
      if (!m) return value || "";
      let hour = parseInt(m[1], 10);
      const min = m[2];
      const ampm = hour >= 12 ? "PM" : "AM";
      hour = hour % 12 === 0 ? 12 : hour % 12;
      return hour + ":" + min + " " + ampm;
    }
    function jobWhen(j) {
      return [fmtDate(j.rideDate || String(j.when || "").slice(0,10)), fmtTime(j.rideTime || String(j.when || "").slice(11))].filter(Boolean).join("  ");
    }
    function digits(p) {
      const d = String(p || "").replace(/\D/g, "");
      return d.length === 10 ? "1" + d : d;
    }
    function prettyPhone(p) {
      const d = String(p || "").replace(/\D/g, "");
      const x = d.length === 11 && d[0] === "1" ? d.slice(1) : d;
      return x.length === 10 ? "(" + x.slice(0,3) + ") " + x.slice(3,6) + "-" + x.slice(6) : (p || "");
    }
    function smsUrl(phone, body) {
      const num = digits(phone);
      const q = encodeURIComponent(body);
      const ios = /iPhone|iPad|Mac/.test(navigator.userAgent);
      if (!num) return ios ? "sms:&body=" + q : "sms:?body=" + q;
      return ios ? "sms:+" + num + "&body=" + q : "sms:+" + num + "?body=" + q;
    }
    function messages(job) {
      const guest = firstName(job.guestName);
      const dname = driver.name;
      const pu = job.pickup ? " (" + shortAddr(job.pickup) + ")" : "";
      const dphone = driver.phone ? " My number is " + prettyPhone(driver.phone) + "." : "";
      return {
        on_the_way: "Hi " + guest + ", this is " + dname + " with Jean Limo. I'm on the way to you now" + pu + "." + dphone,
        on_location: "Hi " + guest + ", this is " + dname + " with Jean Limo. I'm on location and ready for you" + pu + ".",
        dropped_off_owner: ("DONE: " + job.guestName + " dropped off by " + dname + ". " + (job.confirmation || "")).replace(/\s+/g," ").trim()
      };
    }
    async function api(url, opts) {
      const res = await fetch(url, Object.assign({ credentials: "same-origin" }, opts || {}));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }
    function jobDate(j) { return j.rideDate || String(j.when || "").slice(0,10); }
    function withinYear(j) {
      const d = jobDate(j);
      if (!d) return true;
      const cut = new Date(); cut.setFullYear(cut.getFullYear() - 1);
      const c = cut.getFullYear() + "-" + String(cut.getMonth()+1).padStart(2,"0") + "-" + String(cut.getDate()).padStart(2,"0");
      return d >= c;
    }
    function card(j, done) {
      const lines = [
        jobWhen(j),
        j.pickup ? "Pickup: " + j.pickup : "",
        j.dropoff ? "Drop-off: " + j.dropoff : "",
        j.flight ? "Flight: " + j.flight : "",
        j.passengers ? "Passengers: " + j.passengers : ""
      ].filter(Boolean).map(line => "<div class=\"meta\">"+esc(line)+"</div>").join("");
      return "<div class=\"job"+(done?" done":"")+"\" data-open=\""+esc(j.id)+"\"><div style=\"font-size:17px;font-weight:560\">"+esc(j.guestName)+"</div>"+lines+"</div>";
    }
    function setTabs() {
      $("tab-open").classList.toggle("on", tab === "open");
      $("tab-done").classList.toggle("on", tab === "done");
      $("tab-open").textContent = "Upcoming trips ("+jobs.length+")";
      $("tab-done").textContent = "Completed ("+doneJobs.length+")";
    }
    function renderJobs() {
      setTabs();
      const list = tab === "done" ? doneJobs : jobs;
      if (!list.length) {
        $("joblist").innerHTML = tab === "done"
          ? "<p class=\"sub\">No completed jobs in the last year.</p>"
          : "<p class=\"sub\">No upcoming trips assigned to you yet.</p>";
        return;
      }
      $("joblist").innerHTML = list.map(j => card(j, tab === "done")).join("");
      if (tab === "open") $("joblist").querySelectorAll("[data-open]").forEach(el => el.onclick = () => openTrip(el.dataset.open));
    }
    function setGpsLabel(text, on) {
      ["gps","gps2"].forEach(id => { $(id).textContent = text; $(id).className = "gps" + (on ? " on" : ""); });
    }
    function startGps() {
      if (!navigator.geolocation) { setGpsLabel("GPS not available"); return; }
      if (watchId != null) return;
      watchId = navigator.geolocation.watchPosition(async pos => {
        const { latitude, longitude } = pos.coords;
        setGpsLabel("GPS live · " + latitude.toFixed(5) + ", " + longitude.toFixed(5), true);
        try {
          await api("/api/driver/gps", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lat: latitude, lng: longitude, bookingId: current && current.bookingId })
          });
        } catch {}
      }, err => setGpsLabel("GPS permission needed — " + err.message), { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    }
    function stopGps() { if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; }
    async function loadJobs() {
      const data = await api("/api/driver/jobs");
      driver = data.driver;
      const all = data.jobs || [];
      jobs = all.filter(j => j.tripStatus !== "dropped_off");
      doneJobs = all.filter(j => j.tripStatus === "dropped_off" && withinYear(j))
        .sort((a,b) => String(b.when).localeCompare(String(a.when)));
      $("hello").textContent = ((driver && driver.name) || "DRIVER").toUpperCase();
      renderJobs();
    }
    function tripDetails(j) {
      return [
        j.pickup ? "Pickup: " + j.pickup : "",
        j.dropoff ? "Drop-off: " + j.dropoff : "",
        j.flight ? "Flight: " + j.flight : "",
        j.passengers ? "Passengers: " + j.passengers : ""
      ].filter(Boolean).join("\n");
    }
    function openTrip(id) {
      current = jobs.find(j => j.id === id) || current;
      if (!current) return;
      $("trip-when").textContent = jobWhen(current) || "Pickup";
      $("trip-guest").textContent = current.guestName;
      $("trip-route").textContent = tripDetails(current);
      paintStatus(); show("trip");
    }
    function paintStatus() {
      const order = ["on_the_way","on_location","dropped_off"];
      const idx = order.indexOf(current.tripStatus);
      document.querySelectorAll(".status").forEach(btn => {
        const i = order.indexOf(btn.dataset.status);
        btn.classList.remove("next","done");
        if (idx >= i) btn.classList.add("done");
        else if (idx + 1 === i || (idx < 0 && i === 0)) btn.classList.add("next");
      });
    }
    async function enterJobs() {
      startGps();
      await loadJobs();
      show("jobs");
    }
    $("tab-open").onclick = () => { tab = "open"; renderJobs(); };
    $("tab-done").onclick = () => { tab = "done"; renderJobs(); };
    $("signin").onclick = async () => {
      try {
        const data = await api("/api/driver/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: $("username").value.trim(), pin: $("pin").value.trim() })
        });
        driver = data.driver;
        await enterJobs();
      } catch (e) {
        toast(e.message || "Wrong PIN");
      }
    };
    $("signout").onclick = async () => {
      stopGps();
      await fetch("/api/driver/logout", { method: "POST", credentials: "same-origin" });
      driver = null; current = null; jobs = []; doneJobs = [];
      $("pin").value = "";
      show("login");
    };
    $("back").onclick = async () => { current = null; await loadJobs(); show("jobs"); };
    document.querySelectorAll(".status").forEach(btn => btn.onclick = () => {
      if (!current) return;
      const status = btn.dataset.status;
      const msgs = messages(current);
      pending = { status, msgs };
      $("sheet-kicker").textContent = status === "dropped_off" ? "Text dispatch" : "Text guest";
      $("sheet-title").textContent = status.replaceAll("_"," ");
      $("sheet-preview").textContent = status === "dropped_off" ? msgs.dropped_off_owner : msgs[status];
      $("sheet").classList.add("show");
    });
    async function apply() {
      await api("/api/driver/status", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ bookingId: current.bookingId, status: pending.status, live_leg: current.live_leg || "outbound" })
      });
      current.tripStatus = pending.status;
      paintStatus();
    }
    $("send-sms").onclick = async () => {
      await apply();
      const phone = pending.status === "dropped_off" ? "2819170085" : current.guestPhone;
      const body = pending.status === "dropped_off" ? pending.msgs.dropped_off_owner : pending.msgs[pending.status];
      location.href = smsUrl(phone, body);
      $("sheet").classList.remove("show");
    };
    $("send-wa").onclick = async () => {
      await apply();
      const phone = pending.status === "dropped_off" ? "2819170085" : current.guestPhone;
      const body = pending.status === "dropped_off" ? pending.msgs.dropped_off_owner : pending.msgs[pending.status];
      const num = digits(phone);
      location.href = num ? "https://wa.me/"+num+"?text="+encodeURIComponent(body) : "https://wa.me/?text="+encodeURIComponent(body);
      $("sheet").classList.remove("show");
    };
    $("skip").onclick = async () => { await apply(); $("sheet").classList.remove("show"); };
    (async () => {
      try { await enterJobs(); } catch {}
    })();
  </script>
</body>
</html>
