<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jean Limo partner</title>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#0B0B0C; color:#F6F1E8; }
    .wrap { max-width:560px; margin:0 auto; padding:28px 16px 60px; }
    h1 { font-size:30px; margin:8px 0; }
    .gold { color:#C4A574; letter-spacing:.16em; font-size:12px; }
    input, select, button { width:100%; margin-top:10px; border-radius:12px; padding:12px; font-size:16px; box-sizing:border-box; }
    input, select { background:#1C1C20; color:#F6F1E8; border:1px solid rgba(255,255,255,.1); }
    button { border:0; font-weight:700; background:linear-gradient(180deg,#E8D3B0,#C4A574); color:#16110a; }
    .card { margin-top:14px; border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:14px; background:#141416; }
    .muted { color:#9A9388; font-size:14px; }
    .err { color:#f87171; }
    .ok { margin:12px 0; border:1px solid #C4A574; border-radius:12px; padding:12px; color:#E8D3B0; background:#1C1C20; }
    .top { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
    .ghost { width:auto; margin:0; background:transparent; border:1px solid rgba(255,255,255,.15); color:#E8D3B0; padding:8px 14px; }
    .panel { display:none; margin-top:12px; }
    .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08); }
    .who { cursor:pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="gold">PARTNER PORTAL</div>
    <div class="top">
      <h1>Your Jean Limo jobs</h1>
      <button class="ghost" id="driversBtn" hidden>Drivers</button>
    </div>
    <p class="muted">Add a driver once. Tap a name to edit. On a job, select that driver.</p>
    <form id="login">
      <input name="email" type="email" placeholder="Company email" required />
      <input name="pin" placeholder="PIN" required />
      <button type="submit">Sign in</button>
      <p class="err" id="err"></p>
    </form>
    <div id="panel" class="panel card">
      <div class="gold" id="formLabel">DRIVERS</div>
      <input id="dName" placeholder="Driver name" />
      <input id="dPhone" placeholder="Driver phone" />
      <input id="dEmail" type="email" placeholder="Driver email" />
      <button id="addDriver">Add driver</button>
      <div id="roster"></div>
    </div>
    <div id="board" hidden></div>
  </div>
  <script>
    const err = document.getElementById('err');
    const board = document.getElementById('board');
    const panel = document.getElementById('panel');
    let drivers = [];
    let saved = '';
    let editing = null;
    function options(selected) {
      return '<option value="">Select driver</option>' +
        drivers.map(d => '<option value="' + d.id + '"' + (d.email === selected ? ' selected' : '') + '>' + d.name + '</option>').join('');
    }
    function resetForm() {
      editing = null;
      document.getElementById('dName').value = '';
      document.getElementById('dPhone').value = '';
      document.getElementById('dEmail').value = '';
      document.getElementById('addDriver').textContent = 'Add driver';
      document.getElementById('formLabel').textContent = 'DRIVERS';
    }
    async function loadDrivers() {
      const res = await fetch('/api/partner/drivers');
      const data = await res.json();
      drivers = data.drivers || [];
      if (!res.ok && data.error) err.textContent = data.error;
      document.getElementById('roster').innerHTML = drivers.map(d =>
        '<div class="row"><div class="who" data-edit="' + d.id + '">' + d.name + '<div class="muted">' + d.phone + '</div></div><button class="ghost" data-del="' + d.id + '">Delete</button></div>'
      ).join('') || '<p class="muted">No drivers yet.</p>';
      document.querySelectorAll('[data-edit]').forEach(el => el.onclick = () => {
        const driver = drivers.find(d => d.id === el.dataset.edit);
        if (!driver) return;
        editing = driver.id;
        document.getElementById('dName').value = driver.name || '';
        document.getElementById('dPhone').value = driver.phone || '';
        document.getElementById('dEmail').value = driver.email || '';
        document.getElementById('addDriver').textContent = 'Save changes';
        document.getElementById('formLabel').textContent = 'EDIT ' + driver.name;
        panel.scrollIntoView({ behavior: 'smooth' });
      });
      document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
        await fetch('/api/partner/drivers?id=' + btn.dataset.del, { method: 'DELETE' });
        saved = 'Driver deleted';
        resetForm();
        load();
      });
    }
    async function assign(id, driverId) {
      const driver = drivers.find(d => d.id === driverId);
      if (!driver) return;
      const res = await fetch('/api/partner/jobs', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id, driver: driver.name, driverPhone: driver.phone, driverEmail: driver.email })
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error || 'Could not assign'; return; }
      saved = 'Driver assigned. ' + driver.name;
      err.textContent = '';
      load();
    }
    async function load() {
      const res = await fetch('/api/partner/jobs');
      const data = await res.json();
      if (!res.ok) return;
      document.getElementById('login').hidden = true;
      document.getElementById('driversBtn').hidden = false;
      board.hidden = false;
      await loadDrivers();
      board.innerHTML = (saved ? '<div class="ok">' + saved + '</div>' : '') +
        '<p class="muted">' + (data.company || '') + '</p>' + (data.jobs || []).map(job => `
        <div class="card">
          <div class="gold">${job.date || ''} ${job.time || ''} · $${job.pay} · ${job.status}</div>
          <div style="font-size:20px;margin-top:6px">${job.guest}</div>
          <div class="muted">${job.phone || ''}</div>
          <div style="margin-top:8px">${job.pickup || ''}</div>
          <div>${job.dropoff || ''}</div>
          <select data-id="${job.id}">${options(job.driverEmail)}</select>
        </div>`).join('') || '<p>No jobs yet.</p>';
      board.querySelectorAll('select').forEach(select => {
        select.onchange = () => { if (select.value) assign(select.dataset.id, select.value); };
      });
    }
    document.getElementById('driversBtn').onclick = () => {
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    };
    document.getElementById('addDriver').onclick = async () => {
      const body = {
        id: editing,
        name: document.getElementById('dName').value,
        phone: document.getElementById('dPhone').value,
        email: document.getElementById('dEmail').value
      };
      const res = await fetch('/api/partner/drivers', {
        method: editing ? 'PATCH' : 'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error || 'Could not save driver'; return; }
      saved = editing ? 'Driver updated. ' + data.driver.name : 'Driver saved. ' + data.driver.name;
      err.textContent = '';
      resetForm();
      load();
    };
    document.getElementById('login').onsubmit = async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch('/api/partner/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error || 'Could not sign in'; return; }
      load();
    };
    load();
  </script>
</body>
</html>
