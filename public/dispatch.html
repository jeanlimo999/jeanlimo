<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0C" />
  <title>Jean Limo Dispatch</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg:#0B0B0C; --card:#161618; --line:rgba(255,255,255,.1); --gold:#C4A574; --gold2:#E8D3B0; --text:#F6F1E8; --muted:#9A9388; --ok:#7DCFB6; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); padding:18px 16px 40px; }
    .head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:16px; }
    h1 { font-size:28px; font-weight:650; }
    .co { color:var(--muted); margin-top:4px; font-size:14px; }
    .goldbtn { background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#16110a; border:0; border-radius:14px; padding:12px 14px; font-weight:700; font-size:14px; text-decoration:none; display:inline-block; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
    .lbl { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .datebox { text-align:center; background:#111; border-radius:12px; padding:12px; margin:10px 0; font-size:16px; }
    .row2 { display:flex; gap:8px; }
    .row2 button { flex:1; background:#111; border:1px solid var(--line); color:var(--text); border-radius:12px; padding:12px; }
    .stat { font-size:32px; font-weight:650; margin-top:8px; }
    #map { height:220px; border-radius:14px; margin-top:10px; }
    .job { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; }
    .name { font-size:17px; font-weight:560; }
    .meta { color:var(--muted); font-size:13px; margin-top:4px; }
    select, input { width:100%; background:#1C1C20; border:1px solid var(--line); color:var(--text); border-radius:12px; padding:10px 12px; font-size:15px; margin-top:10px; }
    .chip { display:inline-block; margin-top:8px; margin-right:6px; font-size:11px; border:1px solid var(--line); color:var(--muted); padding:4px 8px; border-radius:999px; }
    .chip.gold { color:var(--gold2); }
    .sheet { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); align-items:flex-end; z-index:99999; }
    .sheet.show { display:flex; }
    .panel { width:100%; background:#161618; border-radius:24px 24px 0 0; padding:16px 18px 28px; }
    .primary { width:100%; border:0; border-radius:14px; padding:14px; font-weight:600; background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#16110a; margin-top:12px; }
    .ghost { width:100%; margin-top:10px; background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:14px; padding:12px; }
    .live { float:right; background:#14352c; color:var(--ok); border-radius:999px; padding:4px 8px; font-size:11px; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#222; padding:10px 14px; border-radius:999px; opacity:0; }
    .toast.show { opacity:1; }
    label { display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:10px 0 6px; }
  </style>
</head>
<body>
  <div class="head">
    <div>
      <h1>Daily Dispatch</h1>
      <div class="co">Jean Limo · Houston Operations</div>
    </div>
    <a class="goldbtn" href="https://jeanlimo.com" target="_blank">+ New Reservation</a>
  </div>

  <div class="card">
    <div class="lbl">Dispatch date</div>
    <div class="datebox" id="date-label">Today</div>
    <div class="row2">
      <button type="button" id="prev">‹ Previous</button>
      <button type="button" id="today">Today</button>
    </div>
  </div>

  <div class="card"><div class="lbl">Active / Upcoming</div><div class="stat" id="n-active">0</div></div>
  <div class="card"><div class="lbl">Unassigned</div><div class="stat" id="n-open">0</div></div>
  <div class="card"><div class="lbl">Booked Revenue</div><div class="stat" id="n-rev">$0</div></div>
  <div class="card"><div class="lbl">Drivers Active</div><div class="stat" id="n-drv">0</div></div>

  <div class="card">
    <span class="live" id="n-live">0 LIVE</span>
    <div class="lbl">Live chauffeur GPS</div>
    <div class="meta">Drivers sharing location in the last 2 minutes</div>
    <div id="map"></div>
  </div>

  <div class="row2" style="margin-bottom:12px">
    <button type="button" id="settings">Setup</button>
    <button type="button" id="add-driver">Add driver</button>
  </div>

  <div id="list"></div>

  <div class="sheet" id="sheet">
    <div class="panel">
      <div class="lbl">Supabase</div>
      <h1 style="font-size:22px;margin:8px 0">Connect bookings</h1>
      <label>Project URL</label>
      <input id="sb-url" />
      <label>Anon public key</label>
      <input id="sb-key" />
      <button class="primary" type="button" id="save-sb">Save and load jobs</button>
      <button class="ghost" type="button" id="close-sheet">Close</button>
    </div>
  </div>
  <div class="sheet" id="driver-sheet">
    <div class="panel">
      <div class="lbl">Roster</div>
      <h1 style="font-size:22px;margin:8px 0">Add a driver</h1>
      <label>Name</label><input id="dr-name" />
      <label>Phone</label><input id="dr-phone" />
      <label>PIN</label><input id="dr-pin" inputmode="numeric" />
      <label>Vehicle</label><input id="dr-car" placeholder="sedan" />
      <button class="primary" type="button" id="save-driver">Save driver</button>
      <button class="ghost" type="button" id="close-driver">Close</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="jl.js"></script>
  <script>
    const toast = m => { const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); };
    let jobs=[], drivers=[], map, markers={}, day = new Date();
    function ymd(d){ return d.toISOString().slice(0,10); }
    function label(){
      document.getElementById("date-label").textContent = day.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    }
    function initMap(){
      try {
        map = L.map("map",{zoomControl:false}).setView([29.76,-95.37],10);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
      } catch(e){}
    }
    function drawMap(){
      if(!map) return;
      Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
      const pts=[]; let live=0;
      drivers.forEach(d=>{
        if(d.last_lat && d.last_lng){
          live++;
          const m=L.circleMarker([d.last_lat,d.last_lng],{radius:8,color:"#C4A574",fillColor:"#E8D3B0",fillOpacity:1}).addTo(map);
          m.bindPopup(d.name); markers[d.id]=m; pts.push([d.last_lat,d.last_lng]);
        }
      });
      document.getElementById("n-live").textContent = live + " LIVE";
      document.getElementById("n-drv").textContent = live;
      if(pts.length) map.fitBounds(pts,{padding:[24,24],maxZoom:12});
    }
    function sameDay(j){
      const d = j.rideDate || String(j.when||"").slice(0,10);
      return d === ymd(day);
    }
    function render(){
      const dayJobs = jobs.filter(sameDay);
      const active = dayJobs.filter(j => j.tripStatus !== "dropped_off");
      const open = dayJobs.filter(j => !j.assignedDriverId);
      const rev = dayJobs.reduce((s,j)=>s+(j.amountCents||0),0);
      document.getElementById("n-active").textContent = active.length;
      document.getElementById("n-open").textContent = open.length;
      document.getElementById("n-rev").textContent = "$" + (rev/100).toFixed(0);
      const box=document.getElementById("list");
      const show = dayJobs.length ? dayJobs : jobs.slice(0,20);
      if(!show.length){ box.innerHTML="<p class='meta'>No jobs</p>"; drawMap(); return; }
      if(!dayJobs.length) box.innerHTML = "<p class='meta' style='margin-bottom:10px'>No jobs on this date. Showing all bookings.</p>";
      else box.innerHTML="";
      box.innerHTML += show.map(j=>{
        const d=drivers.find(x=>x.id===j.assignedDriverId);
        const opts="<option value=\"\">Unassigned</option>"+drivers.map(dr=>"<option value=\""+dr.id+"\" "+(dr.id===j.assignedDriverId?"selected":"")+">"+JL.esc(dr.name)+"</option>").join("");
        return "<div class='job'><div style='display:flex;justify-content:space-between'><div class='name'>"+JL.esc(j.guestName)+"</div><div class='lbl'>"+JL.esc(j.conf||"")+"</div></div><div class='meta'>"+JL.esc(j.when||"")+" · "+JL.esc(JL.shortAddr(j.pickup))+"</div><div class='meta'>→ "+JL.esc(JL.shortAddr(j.dropoff))+"</div><span class='chip "+(d?"gold":"")+"'>"+(d?("Driver "+JL.esc(d.name)):"Unassigned")+"</span><span class='chip'>"+JL.esc(j.tripStatus||"")+"</span><select data-assign='"+JL.esc(j.id)+"'>"+opts+"</select></div>";
      }).join("");
      box.querySelectorAll("[data-assign]").forEach(sel=>{
        sel.onchange=async()=>{
          const job=jobs.find(j=>j.id===sel.dataset.assign);
          await JL.assignDriver(job, sel.value);
          toast(sel.value?"Driver assigned":"Unassigned");
          await load();
        };
      });
      drawMap();
    }
    async function load(){
      drivers = await JL.listDrivers();
      jobs = await JL.listJobs();
      label(); render();
    }
    document.getElementById("prev").onclick=()=>{ day.setDate(day.getDate()-1); load(); };
    document.getElementById("today").onclick=()=>{ day=new Date(); load(); };
    document.getElementById("settings").onclick=()=>{
      document.getElementById("sb-url").value=localStorage.getItem("jl_supabase_url")||"https://zfsthgozqowubpmscibd.supabase.co";
      document.getElementById("sb-key").value=localStorage.getItem("jl_supabase_key")||"";
      document.getElementById("sheet").classList.add("show");
    };
    document.getElementById("close-sheet").onclick=()=>document.getElementById("sheet").classList.remove("show");
    document.getElementById("save-sb").onclick=async()=>{
      localStorage.setItem("jl_supabase_url", document.getElementById("sb-url").value.trim());
      localStorage.setItem("jl_supabase_key", document.getElementById("sb-key").value.trim());
      document.getElementById("sheet").classList.remove("show");
      await load();
    };
    document.getElementById("add-driver").onclick=()=>document.getElementById("driver-sheet").classList.add("show");
    document.getElementById("close-driver").onclick=()=>document.getElementById("driver-sheet").classList.remove("show");
    document.getElementById("save-driver").onclick=async()=>{
      try{
        const d=await JL.addDriver({name:document.getElementById("dr-name").value,phone:document.getElementById("dr-phone").value,pin:document.getElementById("dr-pin").value,vehicle:document.getElementById("dr-car").value});
        document.getElementById("driver-sheet").classList.remove("show");
        toast(d.name+" added"); await load();
      }catch(e){ toast(e.message||"Could not add"); }
    };
    initMap(); load(); setInterval(load,20000);
  </script>
</body>
</html>
