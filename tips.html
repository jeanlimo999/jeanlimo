<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jean Limo — Add a tip</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1c1c1c;
      --gold: #c9a227;
      --gold-dim: #8a7018;
      --text: #f3f0e7;
      --muted: #b8b3a6;
      --field: #fff8c8;
      --field-text: #1a1a1a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 48px;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      border: 1px solid var(--gold-dim);
      border-radius: 16px;
      padding: 22px 18px 24px;
      background: var(--card);
    }
    h1 {
      font-size: 15px;
      font-weight: 500;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .price {
      font-size: 36px;
      font-weight: 600;
      color: var(--gold);
      margin: 0 0 6px;
    }
    .sub {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 20px;
    }
    label {
      display: block;
      font-size: 13px;
      margin: 12px 0 6px;
      color: var(--muted);
    }
    input {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 12px 12px;
      font-size: 16px;
      background: var(--field);
      color: var(--field-text);
    }
    .tip-title {
      margin: 22px 0 10px;
      font-size: 15px;
    }
    .tips {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .tip {
      border: 1px solid var(--gold-dim);
      background: transparent;
      color: var(--text);
      border-radius: 10px;
      padding: 12px 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .tip strong { display: block; color: var(--gold); font-size: 16px; }
    .tip.active {
      background: var(--gold);
      color: #1a1400;
      border-color: var(--gold);
    }
    .tip.active strong { color: #1a1400; }
    .totals {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.7;
    }
    .totals .row { display: flex; justify-content: space-between; }
    .totals .total { font-size: 18px; color: var(--gold); font-weight: 600; }
    button.pay {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      background: var(--gold);
      color: #1a1400;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .note {
      margin-top: 14px;
      font-size: 12px;
      color: #8d887c;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Business Sedan · Total due</h1>
    <p class="price" id="displayTotal">$280.00</p>
    <p class="sub">Tips are a percent of the total price below.</p>

    <label>Total price *</label>
    <input id="ridePrice" type="number" min="0" step="0.01" value="280.00" />

    <label>Full Name *</label>
    <input id="name" value="Cash Lam" />

    <label>Phone *</label>
    <input id="phone" value="2819170085" />

    <label>Email *</label>
    <input id="email" value="aznkevin00@gmail.com" />

    <p class="tip-title">Add a tip (optional)</p>
    <div class="tips">
      <button class="tip active" data-pct="0" type="button"><strong>No tip</strong><span class="amt">$0.00</span></button>
      <button class="tip" data-pct="10" type="button"><strong>10%</strong><span class="amt">$28.00</span></button>
      <button class="tip" data-pct="15" type="button"><strong>15%</strong><span class="amt">$42.00</span></button>
      <button class="tip" data-pct="20" type="button"><strong>20%</strong><span class="amt">$56.00</span></button>
      <button class="tip" data-pct="25" type="button"><strong>25%</strong><span class="amt">$70.00</span></button>
    </div>

    <div class="totals">
      <div class="row"><span>Ride</span><span id="rideLine">$280.00</span></div>
      <div class="row"><span>Tip</span><span id="tipLine">$0.00</span></div>
      <div class="row total"><span>Total</span><span id="totalLine">$280.00</span></div>
    </div>

    <button class="pay" id="payBtn" type="button">Continue to Stripe</button>
    <p class="note">Full refund if canceled at least 12 hours before the scheduled pickup time.</p>
  </div>

  <script>
    let tipPct = 0;

    function money(n) {
      return "$" + Number(n).toFixed(2);
    }

    function rideTotal() {
      const n = parseFloat(document.getElementById("ridePrice").value);
      return Number.isFinite(n) && n > 0 ? n : 0;
    }

    function tipAmount() {
      return Math.round(rideTotal() * tipPct) / 100;
    }

    function render() {
      const ride = rideTotal();
      const tip = tipAmount();
      const total = ride + tip;

      document.querySelectorAll(".tip").forEach((btn) => {
        const pct = Number(btn.dataset.pct);
        const amt = Math.round(ride * pct) / 100;
        btn.querySelector(".amt").textContent = money(amt);
      });

      document.getElementById("rideLine").textContent = money(ride);
      document.getElementById("tipLine").textContent = money(tip);
      document.getElementById("totalLine").textContent = money(total);
      document.getElementById("displayTotal").textContent = money(total);
    }

    document.querySelectorAll(".tip").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tip").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        tipPct = Number(btn.dataset.pct);
        render();
      });
    });

    document.getElementById("ridePrice").addEventListener("input", render);
    render();

    document.getElementById("payBtn").addEventListener("click", async () => {
      const ride = rideTotal();
      const payload = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        rideCents: Math.round(ride * 100),
        tipCents: Math.round(tipAmount() * 100),
        tipPercent: tipPct,
      };

      // Point this at your Netlify function or backend:
      // const res = await fetch("/.netlify/functions/create-checkout-session", {
      //   method: "POST",
      //   headers: { "Content-Type": "application/json" },
      //   body: JSON.stringify(payload),
      // });
      // const data = await res.json();
      // window.location = data.url;

      alert(
        "Wire this button to your Stripe function.\n\n" +
        JSON.stringify(payload, null, 2)
      );
    });
  </script>
</body>
</html>
